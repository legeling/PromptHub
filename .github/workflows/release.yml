name: Desktop Build and Release
on:
  workflow_dispatch:
    inputs:
      publish_arm64_beta:
        description: Publish only the verified beta.2 arm64 ZIP
        type: boolean
        default: false
jobs:
  publish-arm64-beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/publish-beta2-zip' && inputs.publish_arm64_beta
    runs-on: ubuntu-latest
    concurrency: publish-v0.6.4-beta.2
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.6.4-beta.2
      SOURCE: ec586b3e87a270512113578b8a4190aee5a62c2f
      ZIP: PromptHub-0.6.4-beta.2-arm64.zip
      DIGEST: e09285a167299d38a7d1c759c8237757e37e150014794fba42d298c4e8a72da4
    steps:
      - name: Verify and publish the accepted ZIP
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO"
          gh api "$api/actions/runs/45745028437" | jq -e '.conclusion=="success" and .head_sha=="ec586b3e87a270512113578b8a4190aee5a62c2f"' >/dev/null
          mkdir accepted
          gh api "$api/actions/artifacts/15082414717/zip" > accepted.zip
          echo 'c40ca59f4945c8005ce3e42598eff0ada7b0dc68ee580f858b7e399221bd9ed8  accepted.zip' | sha256sum -c -
          unzip -p accepted.zip "$ZIP" > "accepted/$ZIP"
          echo "$DIGEST  accepted/$ZIP" | sha256sum -c -
          idle() {
            test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.6.3
            for state in queued in_progress waiting pending requested; do
              gh api --paginate "$api/actions/workflows/release.yml/runs?status=$state" |
                jq -se --arg id "$GITHUB_RUN_ID" 'all(.[].workflow_runs[]; (.id|tostring)==$id)' >/dev/null
            done
          }
          refs() { gh api "$api/git/matching-refs/tags/$TAG"; }
          releases() { gh api --paginate "$api/releases?per_page=100" | jq -sc --arg tag "$TAG" '[.[][]|select(.tag_name==$tag)]'; }
          inspect_draft() {
            releases | jq -e --argjson id "$DRAFT_ID" --arg name "$ZIP" --arg digest "sha256:$DIGEST" '
              length==1 and .[0].id==$id and .[0].draft and .[0].prerelease and
              (.[0].assets|length)==1 and .[0].assets[0].name==$name and
              .[0].assets[0].state=="uploaded" and .[0].assets[0].digest==$digest' >/dev/null
            refs | jq -e --arg ref "refs/tags/$TAG" --arg sha "$SOURCE" 'any(.[]; .ref==$ref and .object.type=="commit" and .object.sha==$sha)' >/dev/null
          }
          idle
          refs | jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref!=$ref)' >/dev/null
          releases | jq -e 'length==0' >/dev/null
          window_open() {
            test "$(TZ=Asia/Shanghai date +%F)" = 2026-11-26
            test "$(TZ=Asia/Shanghai date +%H%M)" -ge 1600
          }
          window_open
          gh api --method POST "$api/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE" >/dev/null
          test "$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE"
          gh release create "$TAG" "accepted/$ZIP" --repo "$GH_REPO" --verify-tag --draft --prerelease --latest=false --title "$TAG" --notes 'macOS Apple 芯片预览版。快速添加可解析带 {CHARACTER} 前言的有效模型回复；保留旧库迁移及外部 Skill 链接修复。仅提供手动安装的 ZIP。'
          DRAFT_ID=$(releases | jq -er 'select(length==1)|.[0].id')
          inspect_draft
          idle
          inspect_draft
          window_open
          gh api --method PATCH "$api/releases/$DRAFT_ID" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh api "$api/releases/$DRAFT_ID" | jq -e --arg digest "sha256:$DIGEST" --arg name "$ZIP" --arg tag "$TAG" '.tag_name==$tag and .prerelease and (.draft|not) and (.assets|length)==1 and .assets[0].name==$name and .assets[0].digest==$digest' >/dev/null
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.6.3
          mkdir public
          curl --fail --location --retry 3 --retry-all-errors --output "public/$ZIP" "https://github.com/$GH_REPO/releases/download/$TAG/$ZIP"
          echo "$DIGEST  public/$ZIP" | sha256sum -c -
