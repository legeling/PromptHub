name: Native Codex Plugin Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native Windows Codex plugin lifecycle
        shell: pwsh
        run: ./scripts/verify-windows-native-codex.ps1
