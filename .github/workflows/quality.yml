name: Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.surfaces.outputs.shared }}
      desktop: ${{ steps.surfaces.outputs.desktop }}
      cli: ${{ steps.surfaces.outputs.cli }}
      mobile: ${{ steps.surfaces.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected surfaces
        id: surfaces
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/detect-ci-surfaces.mjs --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | node scripts/detect-ci-surfaces.mjs >> "$GITHUB_OUTPUT"
          fi

  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify governance
        run: node --experimental-strip-types scripts/verify-release.mts --profile quick --surface governance

  shared-verify:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify shared, database, and core packages
        run: node --experimental-strip-types scripts/verify-release.mts --profile quick --surface shared --surface database --surface core --exclude-layer governance

  cli-verify:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify CLI
        run: node --experimental-strip-types scripts/verify-release.mts --profile release --surface cli --exclude-layer governance

  mobile-verify:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify mobile
        run: node --experimental-strip-types scripts/verify-release.mts --profile quick --surface mobile --exclude-layer governance

  desktop-verify:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Linux credential service
        run: |
          if ! command -v gnome-keyring-daemon >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y gnome-keyring
          fi

      - name: Verify desktop
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            node --experimental-strip-types scripts/verify-release.mts --profile release --surface desktop --exclude-layer governance --exclude-layer e2e
          '
