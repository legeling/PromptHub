name: threatcrush security scan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    name: Scan for credentials and vulnerable patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THREATCRUSH_VERSION: "0.11.9"
      THREATCRUSH_INTEGRITY: "sha512-ZjIYeGPBNIcD2LjanW8pv8NiPclI8IZCaY/8su2vusYklQUROguSusJe+nhoQDLMSGhNM7d/kNJn6snEZrvL9g=="
      THREATCRUSH_FAIL_ON: ""
      THREATCRUSH_SARIF_NAME: threatcrush.sarif
      THREATCRUSH_CHANGED_NAME: threatcrush-changed.bin
      THREATCRUSH_REPORT_NAME: threatcrush-report.md

    steps:
      # Scanner dependencies must not inherit checkout credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine which files this pull request touches
        id: changed
        run: |
          set -euo pipefail
          if [ "$(git rev-list --parents --max-count=1 HEAD | wc -w)" -eq 3 ]; then
            git diff --name-only -z HEAD^1 HEAD > "${RUNNER_TEMP}/${THREATCRUSH_CHANGED_NAME}"
            echo "scoped=true" >> "$GITHUB_OUTPUT"
          else
            : > "${RUNNER_TEMP}/${THREATCRUSH_CHANGED_NAME}"
            echo "scoped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No merge ref — reporting every finding, unscoped."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Reads the root packageManager field; no second pnpm version owner.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install ThreatCrush
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/threatcrush.tgz"
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/@profullstack/threatcrush/-/threatcrush-${THREATCRUSH_VERSION}.tgz" \
            --output "$archive"
          got="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          if [ "$got" != "$THREATCRUSH_INTEGRITY" ]; then
            echo "::error::ThreatCrush integrity mismatch; refusing to install"
            exit 1
          fi

          tool_dir="${RUNNER_TEMP}/threatcrush"
          mkdir -p "$tool_dir"
          pnpm --dir "$tool_dir" add --ignore-scripts --save-exact "$archive"
          cli="$tool_dir/node_modules/.bin/threatcrush"
          "$cli" --version
          echo "THREATCRUSH_CLI=$cli" >> "$GITHUB_ENV"

      # The output lives outside the scanned tree and cannot be supplied by a PR.
      - name: Scan
        id: scan
        run: |
          set -euo pipefail
          code=0
          ARGS=(scan . --format sarif --output "${RUNNER_TEMP}/${THREATCRUSH_SARIF_NAME}")
          if [ -n "$THREATCRUSH_FAIL_ON" ]; then
            ARGS+=(--fail-on "$THREATCRUSH_FAIL_ON")
          fi
          "$THREATCRUSH_CLI" "${ARGS[@]}" || code=$?
          if [ ! -s "${RUNNER_TEMP}/${THREATCRUSH_SARIF_NAME}" ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "::error::ThreatCrush produced no SARIF — this diff was NOT scanned"
            exit 1
          fi
          case "$code" in
            0) echo "status=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "status=findings" >> "$GITHUB_OUTPUT"; exit 1 ;;
            *)
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "::error::ThreatCrush scan failed with exit code $code"
              exit "$code"
              ;;
          esac

      - name: Build the report
        id: report
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
          SCAN_SCOPED: ${{ steps.changed.outputs.scoped }}
        run: |
          node scripts/threatcrush-report.mjs \
            "${RUNNER_TEMP}/${THREATCRUSH_SARIF_NAME}" \
            "${RUNNER_TEMP}/${THREATCRUSH_CHANGED_NAME}" \
            "${RUNNER_TEMP}/${THREATCRUSH_REPORT_NAME}"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threatcrush-sarif
          path: ${{ runner.temp }}/${{ env.THREATCRUSH_SARIF_NAME }}
          if-no-files-found: ignore
          retention-days: 30

      # A malformed or incomplete report must never resolve existing alerts.
      - name: Upload to the Security tab
        if: always() && steps.report.outputs.valid == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: ${{ runner.temp }}/${{ env.THREATCRUSH_SARIF_NAME }}
          category: threatcrush

      # Forks keep a read-only token; do not switch to pull_request_target.
      - name: Comment on PR
        if: >-
          always()
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync(`${process.env.RUNNER_TEMP}/${process.env.THREATCRUSH_REPORT_NAME}`, 'utf8');
            } catch {
              body = '## ThreatCrush Security Scan\n\n**NOT RUN** — report unavailable; see the job log.';
            }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user.type === 'Bot' && c.body.includes('ThreatCrush Security Scan'),
              );
              const target = { owner: context.repo.owner, repo: context.repo.repo, body };
              if (existing) {
                await github.rest.issues.updateComment({ ...target, comment_id: existing.id });
              } else {
                await github.rest.issues.createComment({ ...target, issue_number: context.issue.number });
              }
            } catch (err) {
              core.warning(
                `Could not post PR comment (status ${err.status ?? 'unknown'}): ${err.message}. Findings are in the job summary.`,
              );
            }
